name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/setup_backend.ps1
      - name: Run backend tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/test_backend.ps1
      - name: Verify database migrations
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/check_migrations.ps1

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Test frontend
        run: npm run test
        working-directory: frontend
      - name: Build frontend
        run: npm run build:frontend-bundle
      - name: Verify embedded frontend bundle is fresh
        shell: pwsh
        run: git diff --quiet -- app/frontend_bundle.py
